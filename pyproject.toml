[project]
name = "fire-risk-model"
version = "0.1.0"
description = "Predict the risk (%) that a wildfire reaches within 5 km of an evacuation zone within 12/24/48/72 hours."
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "ipykernel>=7.4.0",
    "joblib>=1.6.0",
    "jupyterlab>=4.6.6",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
]

[tool.uv]
package = false
